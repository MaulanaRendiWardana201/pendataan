<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pendataan Penjualan</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- CEK LOGIN -->
    <script>

        if (
            sessionStorage.getItem("sudahLogin") !== "true"
        ) {

            window.location.href = "login.html";

        }

    </script>


    <div class="container">

        <h1>Pendataan Penjualan</h1>

        <p class="subtitle">
            Catat produk yang terjual dan uang yang masuk
        </p>


        <!-- LOGOUT -->
        <button
            type="button"
            id="logoutButton"
            class="btn-tanggal"
        >
            Keluar
        </button>


        <form id="penjualanForm">


            <!-- ========================================
                 TANGGAL TRANSAKSI
            ======================================== -->

            <div class="form-group">

                <label for="tanggal">
                    Tanggal Transaksi
                </label>

                <input
                    type="date"
                    id="tanggal"
                    required
                >

                <button
                    type="button"
                    id="tanggalHariIni"
                    class="btn-tanggal"
                >
                    Gunakan Tanggal Hari Ini
                </button>

            </div>


            <!-- ========================================
                 PRODUK TERJUAL
            ======================================== -->

            <h2>Produk Terjual</h2>

            <div id="produk-container">


                <!-- ====================================
                     PRODUK PERTAMA
                ==================================== -->

                <div class="produk-item">


                    <!-- NAMA PRODUK -->

                    <div class="form-group">

                        <label>
                            Nama Produk
                        </label>

                        <select
                            class="nama-produk"
                            required
                        >

                            <option value="">
                                Memuat produk...
                            </option>

                        </select>

                    </div>


                    <!-- HARGA JUAL -->

                    <div class="form-group">

                        <label>
                            Harga Satuan (Rp)
                        </label>

                        <input
                            type="number"
                            class="harga-produk"
                            placeholder="Harga otomatis"
                            min="0"
                            readonly
                            required
                        >

                    </div>


                    <!-- STOK -->

                    <div class="form-group">

                        <label>
                            Stok Tersedia
                        </label>

                        <input
                            type="number"
                            class="stok-produk"
                            placeholder="Stok otomatis"
                            min="0"
                            readonly
                        >

                    </div>


                    <!-- JUMLAH TERJUAL -->

                    <div class="form-group">

                        <label>
                            Jumlah Terjual
                        </label>

                        <input
                            type="number"
                            class="jumlah-produk"
                            placeholder="Masukkan jumlah barang"
                            min="1"
                            value="1"
                            required
                        >

                    </div>


                    <!-- SUBTOTAL -->

                    <div class="subtotal">

                        Subtotal

                        <strong>
                            Rp 0
                        </strong>

                    </div>


                    <!-- HAPUS -->

                    <button
                        type="button"
                        class="hapus-produk"
                    >
                        Hapus Produk
                    </button>

                </div>

            </div>


            <!-- ========================================
                 TAMBAH PRODUK
            ======================================== -->

            <button
                type="button"
                id="tambahProduk"
                class="btn-tambah"
            >
                + Tambah Produk
            </button>


            <!-- ========================================
                 TOTAL UANG MASUK
            ======================================== -->

            <div class="total-box">

                <span>
                    Total Uang Masuk
                </span>

                <strong id="total">
                    Rp 0
                </strong>

            </div>


            <!-- ========================================
                 CATATAN
            ======================================== -->

            <div class="form-group">

                <label for="catatan">
                    Catatan
                </label>

                <textarea
                    id="catatan"
                    placeholder="Catatan tambahan (opsional)"
                ></textarea>

            </div>


            <!-- ========================================
                 SIMPAN DATA
            ======================================== -->

            <button
                type="submit"
                class="btn-simpan"
            >
                Simpan Data
            </button>


        </form>

    </div>


    <!-- JAVASCRIPT UTAMA -->

    <script src="script.js"></script>


    <!-- LOGOUT -->

    <script>

        document
            .getElementById("logoutButton")
            .addEventListener(
                "click",
                function() {

                    sessionStorage.removeItem(
                        "sudahLogin"
                    );

                    window.location.href =
                        "login.html";

                }
            );

    </script>

</body>

</html>
